<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrivision - Novo scan</title>
    <style>
        :root {
            --primary: #17B26A;
            --primary-ink: #0E7A45;
            --lime: #C9F73D;
            --bone: #F5F3E9;
            --ink: #0B0F0D;
            --surface-dark: #2A322D;
            --surface-gesture: #0E1512;
            --elevated: #EAE7D9;
            --muted: #606961;
            --danger: #E2402C;
            --warning: #E8A200;

            --font-archivo: 'Archivo', sans-serif;
            --font-inter: 'Inter Tight', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 24px 0; background-color: #12181a;
            font-family: var(--font-inter);
            display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
        }

        .phone-frame {
            width: 100%; max-width: 400px; background-color: var(--surface-dark);
            border: 3px solid var(--ink); border-radius: 8px;
            box-shadow: 6px 4px 0 rgba(0,0,0,0.6);
            position: relative; overflow: hidden;
        }

        .screen-body { padding: 40px 20px 28px; }

        .scan-header {
            display: flex; justify-content: space-between; align-items: center;
        }
        .close-btn {
            width: 44px; height: 44px; background-color: var(--surface-gesture);
            border: 2px solid rgba(245,243,233,0.35); border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            color: var(--bone); font-size: 24px; font-weight: 700; cursor: pointer;
        }
        .scan-header h1 {
            font-family: var(--font-archivo); font-weight: 800; font-size: 14px;
            color: var(--bone); text-transform: uppercase; letter-spacing: 1.2px; margin: 0;
        }
        .spacer { width: 44px; }

        .viewfinder {
            width: 100%; aspect-ratio: 1 / 0.92; background-color: var(--surface-gesture);
            border: 2px solid rgba(245,243,233,0.18); border-radius: 4px;
            position: relative; overflow: hidden; margin-top: 24px;
        }
        .viewfinder-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 100%;
        }
        .frame-box {
            width: 120px; height: 120px; border: 3px solid var(--lime);
            border-radius: 4px; margin: 0 auto 18px;
            display: flex; align-items: center; justify-content: center;
        }
        .frame-box span {
            font-family: var(--font-archivo); font-weight: 800; font-size: 16px;
            color: var(--lime); letter-spacing: 1.1px; text-transform: uppercase;
        }
        .instruction {
            font-family: var(--font-archivo); font-weight: 800; font-size: 16px;
            color: var(--bone); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
        }
        .hint { font-size: 13px; color: rgba(245,243,233,0.65); }
        .corner { position: absolute; width: 22px; height: 22px; border: 3px solid var(--lime); border-radius: 2px; }
        .corner-tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
        .corner-tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
        .corner-br { bottom: 14px; right: 14px; border-left: none; border-top: none; }

        .warning-banner {
            background-color: rgba(232,162,0,0.14);
            border: 1px solid rgba(232,162,0,0.5); border-radius: 4px;
            padding: 10px; margin-top: 18px;
        }
        .warning-banner p { color: var(--bone); font-size: 12px; font-weight: 500; margin: 0; }

        .btn-primary {
            width: 100%; background-color: var(--primary); color: var(--primary-ink);
            border: 3px solid var(--ink); border-radius: 4px; height: 56px;
            font-family: var(--font-archivo); font-weight: 800; font-size: 16px;
            letter-spacing: 0.4px; text-transform: uppercase; cursor: pointer;
            box-shadow: 6px 4px 0 var(--ink); margin-top: 18px;
        }
        .btn-secondary {
            width: 100%; background-color: var(--surface-gesture); color: var(--bone);
            border: 3px solid var(--ink); border-radius: 4px; height: 52px;
            font-family: var(--font-archivo); font-weight: 800; font-size: 16px;
            letter-spacing: 0.4px; text-transform: uppercase; cursor: pointer;
            box-shadow: 6px 4px 0 var(--ink); margin-top: 10px;
        }

        /* Loading state */
        .loading { display: none; }
        .loading.active { display: block; }
        .default-state.hidden { display: none; }

        .spinner {
            width: 44px; height: 44px; border: 3px solid rgba(245,243,233,0.2);
            border-top-color: var(--lime); border-radius: 50%;
            margin: 40px auto 20px; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-family: var(--font-archivo); font-weight: 800; font-size: 16px;
            color: var(--bone); text-transform: uppercase; letter-spacing: 0.4px;
            text-align: center; margin-bottom: 8px;
        }
        .loading-subtext { font-size: 13px; color: rgba(245,243,233,0.7); text-align: center; }

        .back-link {
            display:block; text-align:center; margin-top:14px; color: rgba(245,243,233,0.7);
            font-size: 12px; font-weight: 700; text-decoration: none;
        }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-50..200" />
    <style>
        .ms {
            font-family: 'Material Symbols Outlined';
            font-weight: normal; font-style: normal;
            font-size: 20px; line-height: 1; letter-spacing: normal;
            text-transform: none; display: inline-flex; align-items: center;
            justify-content: center; white-space: nowrap; direction: ltr;
            vertical-align: middle;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
        }
        .ms.fill { font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24; }
        .meal-thumb .ms { font-size: 26px; }
        .fab .ms, .scan-btn .ms { font-size: 24px; }
        .icon-btn .ms, .unpin-btn .ms, .mini-btn .ms, .close-btn .ms { font-size: 18px; }
        .pin-badge .ms { font-size: 15px; }
        .tab .ms { font-size: 24px; color: var(--ink); margin-bottom: 2px; }
        .chip .ms { font-size: 15px; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen-body">
            <!-- Estado padrão -->
            <div id="default-state" class="default-state">
                <div class="scan-header">
                    <button class="close-btn" onclick="window.location.href='HomeScreen.html'"><span class="ms">close</span></button>
                    <h1>Novo scan</h1>
                    <div class="spacer"></div>
                </div>

                <div class="viewfinder">
                    <div class="corner corner-tl"></div>
                    <div class="corner corner-tr"></div>
                    <div class="corner corner-bl"></div>
                    <div class="corner corner-br"></div>
                    <div class="viewfinder-center">
                        <div class="frame-box"><span>Foto</span></div>
                        <div class="instruction">Aponte para o alimento</div>
                        <div class="hint">Enquadre a porção inteira, com boa luz</div>
                    </div>
                </div>

                <div class="warning-banner">
                    <p>Sem chave Gemini a análise automática fica indisponível. Você pode registrar os valores manualmente.</p>
                </div>

                <button class="btn-primary" onclick="startLoading()">Tirar foto</button>
                <button class="btn-secondary">Escolher da galeria</button>
                <button class="btn-secondary" onclick="window.location.href='ResultScreen.html'">Inserir manualmente</button>
            </div>

            <!-- Estado de carregamento -->
            <div id="loading-state" class="loading">
                <div class="scan-header">
                    <button class="close-btn" style="opacity:0.3;"><span class="ms">close</span></button>
                    <h1>Novo scan</h1>
                    <div class="spacer"></div>
                </div>
                <div class="spinner"></div>
                <div class="loading-text">Analisando...</div>
                <div class="loading-subtext" id="loading-subtext">Consultando o Gemini</div>
            </div>
        </div>
    </div>

    <script>
        function startLoading() {
            document.getElementById('default-state').classList.add('hidden');
            document.getElementById('loading-state').classList.add('active');
            setTimeout(() => {
                document.getElementById('loading-subtext').textContent = 'Estimando macros...';
            }, 1000);
            setTimeout(() => {
                window.location.href = 'ResultScreen.html';
            }, 2200);
        }
    </script>
</body>
</html>
